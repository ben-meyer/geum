name: Deploy Geum Theme to cPanel

on:
  push:
    branches:
      - production  # Only deploy from production branch

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Match .nvmrc
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Configure ACF Pro authentication
        run: |
          echo '{
            "http-basic": {
              "connect.advancedcustomfields.com": {
                "username": "${{ secrets.ACF_PRO_KEY }}",
                "password": "${{ secrets.SITE_URL }}"
              }
            }
          }' > auth.json

      - name: Install Node dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build production assets
        run: npm run build

      - name: Clean up dev files before deployment
        run: |
          rm -rf node_modules
          rm -rf .github
          rm -rf .vscode
          rm -rf .docs
          rm -rf dev-scripts
          rm -rf assets
          rm -rf .claude
          rm -f .babelrc .browserslistrc .deployignore .editorconfig
          rm -f .eslintrc.json .gitignore .gitkeep .gitmodules .nvmrc
          rm -f .prettierrc .stylelintrc composer.json composer.lock
          rm -f gulpfile.js LICENCE package-lock.json package.json
          rm -f postcss.config.js readme.md webpack.config.js
          rm -f vite.config.js biome.json pint.json phpcs.xml
          rm -f auth.json

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          local_path: './*'
          sftp_only: true
          port: 2223
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/***/Tests/**
            **/vendor/***/tests/**
            **/.vscode/**
            **/.babelrc
            **/.browserslistrc
            **/.deployignore
            **/.editorconfig
            **/.eslintrc.json
            **/.gitignore
            **/.gitkeep
            **/.gitmodules
            **/.nvmrc
            **/.prettierrc
            **/.stylelintrc
            **/composer.json
            **/composer.lock
            **/gulpfile.js
            **/LICENCE
            **/LICENSE
            **/package-lock.json
            **/package.json
            **/postcss.config.js
            **/readme.md
            **/README.md
            **/webpack.config.js
            **/vite.config.js
            **/biome.json
            **/pint.json
            **/phpcs.xml
            **/.docs/**
            **/dev-scripts/**
            **/assets/**
            **/.claude/**
