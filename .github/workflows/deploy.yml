name: Deploy Geum Theme to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Configure ACF Pro authentication
        run: |
          echo '{
            "http-basic": {
              "connect.advancedcustomfields.com": {
                "username": "${{ secrets.ACF_PRO_KEY }}",
                "password": "${{ secrets.SITE_URL }}"
              }
            }
          }' > auth.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build production assets
        run: npm run build

      - name: Deploy theme via SFTP
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://${{ secrets.FTP_SERVER }}:2223;
            mirror --reverse --delete --verbose \
              --exclude ^\.git/ \
              --exclude ^node_modules/ \
              --exclude ^assets/ \
              --exclude ^dev-scripts/ \
              --exclude ^\.vscode/ \
              --exclude ^\.github/ \
              --exclude ^\.claude/ \
              --exclude ^\.docs/ \
              --exclude ^Geum/Dev/ \
              --exclude ^Theme/Dev/ \
              --exclude ^vendor/squizlabs/ \
              --exclude vendor/.*/tests/ \
              --exclude vendor/.*/Tests/ \
              --exclude example\.php$ \
              --exclude ^\.babelrc$ \
              --exclude ^\.browserslistrc$ \
              --exclude ^\.editorconfig$ \
              --exclude ^\.eslintrc\.json$ \
              --exclude ^\.nvmrc$ \
              --exclude ^\.prettierrc$ \
              --exclude ^\.stylelintrc$ \
              --exclude ^\.env\.example$ \
              --exclude ^auth\.json$ \
              --exclude ^composer\.json$ \
              --exclude ^composer\.lock$ \
              --exclude ^gulpfile\.js$ \
              --exclude ^LICENCE$ \
              --exclude ^package-lock\.json$ \
              --exclude ^package\.json$ \
              --exclude ^postcss\.config\.js$ \
              --exclude ^vite\.config\.js$ \
              --exclude ^tailwind\.config\.js$ \
              --exclude ^biome\.json$ \
              --exclude ^pint\.json$ \
              --exclude ^phpcs\.xml$ \
              --exclude ^readme\.md$ \
              --exclude ^CLAUDE\.md$ \
              --exclude ^webpack\.config\.js$ \
              ./ ${{ secrets.FTP_SERVER_DIR }};
          "

