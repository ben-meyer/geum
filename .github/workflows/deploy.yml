name: Deploy Geum Theme to cPanel

on:
  push:
    branches:
      - production  # Only deploy from production branch

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Match .nvmrc
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Configure ACF Pro authentication
        run: |
          echo '{
            "http-basic": {
              "connect.advancedcustomfields.com": {
                "username": "${{ secrets.ACF_PRO_KEY }}",
                "password": "${{ secrets.SITE_URL }}"
              }
            }
          }' > auth.json

      - name: Install Node dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build production assets
        run: npm run build

      - name: Clean up dev files before deployment
        run: |
          # Large directories
          rm -rf .git
          rm -rf node_modules
          rm -rf .github
          rm -rf .vscode
          rm -rf .docs
          rm -rf .claude
          rm -rf dev-scripts
          rm -rf assets
          rm -rf Geum/Dev
          rm -rf Theme/Dev

          # Vendor dev/test files
          rm -rf vendor/squizlabs
          find vendor -type d \( -name tests -o -name Tests -o -name test -o -name Test \) -exec rm -rf {} + 2>/dev/null || true
          find vendor -name '.git' -type d -exec rm -rf {} + 2>/dev/null || true

          # Component dev files
          find components -name 'example.php' -delete 2>/dev/null || true

          # Config and dot files
          rm -f .babelrc .browserslistrc .deployignore .editorconfig
          rm -f .eslintrc.json .gitignore .gitkeep .gitmodules .nvmrc
          rm -f .prettierrc .stylelintrc .gitattributes .env.example
          rm -f composer.json composer.lock auth.json
          rm -f gulpfile.js LICENCE package-lock.json package.json
          rm -f postcss.config.js readme.md webpack.config.js
          rm -f vite.config.js tailwind.config.js biome.json pint.json phpcs.xml
          rm -f CLAUDE.md

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          local_path: .
          sftp_only: true
          port: 2223
          delete_remote_files: false
