name: Deploy Geum Theme to cPanel

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Configure ACF Pro authentication
        run: |
          echo '{
            "http-basic": {
              "connect.advancedcustomfields.com": {
                "username": "${{ secrets.ACF_PRO_KEY }}",
                "password": "${{ secrets.SITE_URL }}"
              }
            }
          }' > auth.json

      - name: Install Node dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build production assets
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/***/Tests/**
            **/vendor/***/tests/**
            **/.vscode/**
            **/.claude/**
            **/.docs/**
            **/dev-scripts/**
            **/assets/**
            **/Geum/Dev/**
            **/Theme/Dev/**
            **/vendor/squizlabs/**
            **/components/**/example.php
            **/.babelrc
            **/.browserslistrc
            **/.deployignore
            **/.editorconfig
            **/.eslintrc.json
            **/.gitignore
            **/.gitkeep
            **/.gitmodules
            **/.nvmrc
            **/.prettierrc
            **/.stylelintrc
            **/.env.example
            **/auth.json
            **/composer.json
            **/composer.lock
            **/gulpfile.js
            **/LICENCE
            **/LICENSE
            **/package-lock.json
            **/package.json
            **/postcss.config.js
            **/vite.config.js
            **/tailwind.config.js
            **/biome.json
            **/pint.json
            **/phpcs.xml
            **/readme.md
            **/README.md
            **/CLAUDE.md
            **/webpack.config.js
